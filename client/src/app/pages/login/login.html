<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <mat-card class="w-full max-w-md p-6 shadow-xl rounded-2xl bg-white">
    <mat-card-header class="mb-6 flex flex-col items-center text-center">
      <mat-card-title class="text-2xl font-bold text-slate-800">Bienvenido</mat-card-title>
      <mat-card-subtitle class="text-slate-500 mt-1">Ingresa a tu cuenta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" placeholder="Ingresa tu usuario" />
          <mat-icon matSuffix class="text-slate-400">person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            El usuario es obligatorio
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Contraseña</mat-label>
          <input 
            matInput 
            [type]="hidePassword ? 'password' : 'text'" 
            formControlName="password" 
            placeholder="••••••••" />
          <button 
            type="button" 
            mat-icon-button 
            matSuffix 
            (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            La contraseña es obligatoria
          </mat-error>
        </mat-form-field>

        <div *ngIf="errorMessage" class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm text-center">
          {{ errorMessage }}
        </div>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          [disabled]="loginForm.invalid || isLoading"
          class="w-full py-3 mt-2 text-base font-semibold rounded-lg">
          <span *ngIf="!isLoading">Ingresar</span>
          <mat-spinner *ngIf="isLoading" diameter="24" class="mx-auto"></mat-spinner>
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
