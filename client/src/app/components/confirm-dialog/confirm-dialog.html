<div class="p-2">
  <div class="flex items-center gap-3 mb-2">
    <mat-icon [color]="data.color || 'warn'" class="scale-125">warning</mat-icon>
    <h2 mat-dialog-title class="text-xl font-bold text-slate-800 !m-0">
      {{ data.titulo }}
    </h2>
  </div>

  <mat-dialog-content class="!py-3">
    <p class="text-slate-600 text-sm leading-relaxed">
      {{ data.mensaje }}
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="gap-2 pt-2">
    <button mat-button (click)="cancelar()" class="rounded-lg">
      Cancelar
    </button>
    <button 
      mat-raised-button 
      [color]="data.color || 'warn'" 
      (click)="confirmar()"
      class="rounded-lg shadow-sm">
      {{ data.textoBotonConfirmar || 'Eliminar' }}
    </button>
  </mat-dialog-actions>
</div>
